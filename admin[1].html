<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | SandCraft</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        input, textarea, button,.file-upload { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #10b981; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #059669; }
        .hidden { display: none; }
        .info { font-size: 14px; color: #94a3b8; text-align: center; line-height: 1.4; }
        label { font-size: 14px; color: #cbd5e1; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="card" id="loginBox">
        <h2>Вход для Администратора</h2>
        <input type="password" id="passInput" placeholder="Введите пароль админа">
        <button onclick="checkPassword()">Войти как Админ</button>
        <button onclick="window.location.href='index.html'" style="background: #475569;">Вернуться на сайт</button>
    </div>

    <!-- Панель управления (скрыта до ввода пароля) -->
    <div class="card hidden" id="adminPanel">
        <h2>Панель Создателя SandCraft</h2>
        <p class="info">Добро пожаловать, шеф! Здесь ты управляешь контентом.</p>
        
        <label>Загрузить APK-файл игры:</label>
        <input type="file" id="apkFile" class="file-upload">

        <label>Загрузить скриншот или логотип:</label>
        <input type="file" id="imgFile" class="file-upload">

        <button onclick="alert('Файлы готовы к привязке к репозиторию GitHub!')">Загрузить на сайт</button>
        
        <button onclick="window.location.href='index.html'" style="background: #38bdf8;">Перейти на главную</button>
        <button onclick="logout()" style="background: #ef4444;">Выйти из админки</button>
    </div>

    <script>
        // Твой секретный пароль
        const ADMIN_PASS = "220kg"; 

        function checkPassword() {
            const entered = document.getElementById('passInput').value;
            if (entered === ADMIN_PASS) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                localStorage.setItem('sandcraft_admin', 'true');
            } else {
                alert('Неверный пароль!');
            }
        }

        // Автоматический вход, если сессия сохранена
        if (localStorage.getItem('sandcraft_admin') === 'true') {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        }

        function logout() {
            localStorage.removeItem('sandcraft_admin');
            location.reload();
        }
    </script>
</body>
</html>
