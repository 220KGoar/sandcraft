<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | SandCraft</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #38bdf8; text-align: center; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        button { background: #10b981; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #059669; }
        .hidden { display: none; }
        .info { font-size: 14px; color: #94a3b8; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="card" id="loginBox">
        <h2>Вход в Админку</h2>
        <input type="password" id="passInput" placeholder="Введите пароль админа">
        <button onclick="checkPassword()">Войти</button>
    </div>

    <!-- Панель управления (скрыта до ввода пароля) -->
    <div class="card hidden" id="adminPanel">
        <h2>SandCraft Admin</h2>
        <p class="info">Здесь ты можешь управлять данными игры.</p>
        
        <label>Ссылка на новый APK:</label>
        <input type="text" id="apkLink" placeholder="https://...">

        <label>Текст последнего обновления:</label>
        <textarea id="updateText" rows="4" placeholder="Что нового в этой версии?"></textarea>

        <button onclick="saveData()">Сохранить изменения</button>
        <button onclick="logout()" style="background: #ef4444;">Выйти</button>
    </div>

    <script>
        // Установи свой секретный пароль здесь:
        const ADMIN_PASS = "220kg"; 

        function checkPassword() {
            const entered = document.getElementById('passInput').value;
            if (entered === ADMIN_PASS) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                localStorage.setItem('sandcraft_auth', 'true');
            } else {
                alert('Неверный пароль!');
            }
        }

        // Авто-вход, если уже вводил пароль на этом устройстве
        if (localStorage.getItem('sandcraft_auth') === 'true') {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
        }

        function saveData() {
            const link = document.getElementById('apkLink').value;
            const text = document.getElementById('updateText').value;
            
            // Сохраняем в память браузера (или передаем дальше)
            localStorage.setItem('latest_apk', link);
            localStorage.setItem('latest_update', text);
            
            alert('Данные сохранены! (Чтобы они появились на главном сайте, мы свяжем их с index.html)');
        }

        function logout() {
            localStorage.removeItem('sandcraft_auth');
            location.reload();
        }
    </script>
</body>
</html>
